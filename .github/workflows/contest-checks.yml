name: Contest checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Contest contract
        run: npm run check:contest
      - name: Full static and data checks
        run: npm run check

  sensor-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sensor-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sensor-platform/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:pages-worker
      - run: npm run test:pages
